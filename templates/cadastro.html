{% extends "base.html" %}

{% block title %}
Cadastro - MEICash
{% endblock %}


{% block content %}

<h2>Criar conta</h2>

<p>Cadastre-se para começar a utilizar o MEICash.</p>

<form method="POST">

    <div>
        <label for="nome">Nome completo</label>
        <input
            type="text"
            id="nome"
            name="nome"
            required
        >
    </div>

    <div>
        <label for="email">E-mail</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="cpf">CPF</label>
        <input
            type="text"
            id="cpf"
            name="cpf"
            required
        >
    </div>

    <div>
        <label for="telefone">Telefone</label>
        <input
            type="text"
            id="telefone"
            name="telefone"
        >
    </div>

    <div>
        <label for="senha">Senha</label>
        <input
            type="password"
            id="senha"
            name="senha"
            required
        >
    </div>

    <div>
        <label for="confirmar_senha">
            Confirmar senha
        </label>

        <input
            type="password"
            id="confirmar_senha"
            name="confirmar_senha"
            required
        >
    </div>

    <button type="submit">
        Cadastrar
    </button>

</form>

{% endblock %}
