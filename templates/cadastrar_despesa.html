{% extends "base.html" %}

{% block title %}
Cadastrar Despesa - MEICash
{% endblock %}


{% block content %}

<h2>Cadastrar Despesa</h2>

<p>
    Registre uma nova saída financeira.
</p>

<form method="POST">

    <div>
        <label for="descricao">
            Descrição
        </label>

        <input
            type="text"
            id="descricao"
            name="descricao"
            required
        >
    </div>

    <div>
        <label for="valor">
            Valor
        </label>

        <input
            type="number"
            id="valor"
            name="valor"
            step="0.01"
            min="0.01"
            required
        >
    </div>

    <div>
        <label for="data">
            Data
        </label>

        <input
            type="date"
            id="data"
            name="data"
            required
        >
    </div>

    <div>
        <label for="categoria">
            Categoria
        </label>

        <select
            id="categoria"
            name="categoria"
            required
        >

            <option value="">
                Selecione
            </option>

            <option value="Materiais">
                Materiais
            </option>

            <option value="Aluguel">
                Aluguel
            </option>

            <option value="Serviços">
                Serviços
            </option>

            <option value="Marketing">
                Marketing
            </option>

            <option value="Transporte">
                Transporte
            </option>

            <option value="Impostos">
                Impostos
            </option>

            <option value="Outros">
                Outros
            </option>

        </select>
    </div>

    <div>
        <label for="forma_pagamento">
            Forma de pagamento
        </label>

        <select
            id="forma_pagamento"
            name="forma_pagamento"
            required
        >

            <option value="">
                Selecione
            </option>

            <option value="Pix">
                Pix
            </option>

            <option value="Dinheiro">
                Dinheiro
            </option>

            <option value="Cartão">
                Cartão
            </option>

            <option value="Transferência">
                Transferência
            </option>

            <option value="Boleto">
                Boleto
            </option>

        </select>
    </div>

    <div>
        <label for="observacoes">
            Observações
        </label>

        <textarea
            id="observacoes"
            name="observacoes"
            rows="4"
        ></textarea>
    </div>

    <button type="submit">
        Salvar Despesa
    </button>

</form>

<p>
    <a href="{{ url_for('movimentacoes.listar') }}">
        Voltar
    </a>
</p>

{% endblock %}
