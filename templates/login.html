{% extends "base.html" %}

{% block title %}
Login - MEICash
{% endblock %}


{% block content %}

<h2>Entrar</h2>

<p>Acesse sua conta do MEICash.</p>

<form method="POST">

    <div>
        <label for="email">E-mail</label>

        <input
            type="email"
            id="email"
            name="email"
            required
        >
    </div>

    <div>
        <label for="senha">Senha</label>

        <input
            type="password"
            id="senha"
            name="senha"
            required
        >
    </div>

    <button type="submit">
        Acessar
    </button>

</form>

<p>
    Ainda não possui uma conta?

    <a href="{{ url_for('auth.cadastro') }}">
        Criar conta
    </a>
</p>

{% endblock %}
