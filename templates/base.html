<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        MEICash
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header>
        <h1>MEICash</h1>
        <p>Seu negócio no controle</p>
    </header>

    <main>

        {% with mensagens = get_flashed_messages(with_categories=true) %}

            {% if mensagens %}

                {% for categoria, mensagem in mensagens %}

                    <div class="mensagem {{ categoria }}">
                {{ mensagem }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
